name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Conventional Commits, enforced only on pull requests.
  #
  # Deliberately NOT run on pushes to main: the older history does not follow
  # the convention, and retroactively failing CI on it would be noise with
  # nothing actionable behind it.
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        # commitlint needs the full range between base and head to know which
        # commits belong to this PR; the default shallow clone hides them.
        fetch-depth: 0

    - name: Lint commit messages
      uses: wagoid/commitlint-github-action@v6

    # If this repository ever squash-merges, the commit that lands on main is
    # the *pull request title*, not any of the commits linted above - so an
    # unconventional title would silently become an unconventional commit on
    # main. Checking it here keeps the rule true whichever merge strategy is
    # used. Kept as a plain regex rather than a second commitlint invocation
    # because it only needs to match the type/scope/subject shape.
    - name: Lint pull request title
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'
        if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
          echo "::error::PR title is not a Conventional Commit: '$PR_TITLE'"
          echo "Expected e.g. 'feat(storage): migrate data when storage.type changes'"
          echo "Valid types: build chore ci docs feat fix perf refactor revert style test"
          exit 1
        fi
        echo "PR title OK: $PR_TITLE"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        toolchain: stable
    
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: rust-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        shared-key: rust-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
        save-if: ${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
        workspaces: "**/Cargo.toml"
        cache-targets: true
        cache-on-failure: true

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    # A raw test count is this project's cheapest tripwire for its known
    # failure mode: a test deleted rather than a bug fixed. Reported, not
    # enforced - a hard failure on a decreasing count would also fire on
    # legitimate consolidation, which just teaches people to override it.
    # The direction of the number is the signal; this is not a coverage
    # target, which the working notes reject explicitly.
    #
    # Counted by asking each test harness for its own list rather than by
    # parsing `cargo test` output: cargo writes the "Running <binary>"
    # headers to stderr and each harness writes its "test result" line to
    # stdout, so merging the two streams to pair a name with a count relies
    # on interleaving that buffering does not guarantee.
    - name: Report test counts
      shell: bash
      run: |
        set -uo pipefail
        total=0
        rows=""
        while read -r name exe; do
          n=$("$exe" --list 2>/dev/null | grep -c ': test$' || true)
          rows+="| \`$name\` | $n |"$'\n'
          total=$((total + n))
        done < <(cargo test --no-run --message-format=json 2>/dev/null \
          | jq -r 'select(.executable != null and .profile.test == true)
                   | "\(.target.name) \(.executable)"' \
          | sort)
        {
          echo "### Test counts"
          echo
          echo "| Test binary | Tests |"
          echo "| --- | --- |"
          printf '%s' "$rows"
          echo "| **Total** | **$total** |"
        } | tee -a "$GITHUB_STEP_SUMMARY" 